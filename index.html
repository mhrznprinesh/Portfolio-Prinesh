
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">

    <title>Portfolio Under Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        .status {
            display: inline-block;
            padding: 9px 18px;
            margin-bottom: 35px;
            border: 1px solid #334155;
            border-radius: 30px;
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -1.5px;
            margin-bottom: 22px;
        }

        h1 span {
            color: #60a5fa;
        }

        .description {
            max-width: 510px;
            margin: 0 auto;
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.8;
        }

        .divider {
            width: 55px;
            height: 2px;
            background: #3b82f6;
            margin: 35px auto;
        }

        .footer {
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="status">
            ● Portfolio Under Maintenance
        </div>

        <div class="icon">⚙️</div>

        <h1>
            Something New<br>
            Is <span>in the Works.</span>
        </h1>

        <p class="description">
            I'm currently updating my portfolio to better
            showcase my work, projects, and professional
            journey.

            I'll be back soon with a refreshed experience.
        </p>

        <div class="divider"></div>

        <p class="footer">
            Thank you for visiting.<br>
            I appreciate your patience and understanding.
        </p>

    </main>

</body>
</html>
